services:
  boundary-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime          # use the lean runtime stage
    image: mh-boundary-api:latest
    container_name: mh-boundary-api
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      # Boundary datasets are downloaded from this private bucket at startup
      - GCS_BUCKET_NAME=cropgen-maharashtra-boundary
      - GCS_MH1_PATH=boundary-data/mh1.geojson
      - GCS_MH2_PATH=boundary-data/mh2.geojson
    # Local Docker only: reuse the ADC created by
    # `gcloud auth application-default login` (read-only, never copied into
    # the image). On Cloud Run the attached service account is used instead.
    volumes:
      - ${HOME}/.config/gcloud/application_default_credentials.json:/home/appuser/.config/gcloud/application_default_credentials.json:ro
    healthcheck:
      test: ["CMD", "python", "-c",
             "import socket; socket.create_connection(('localhost', 8080), 5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s      # allow time for GCS download + data load at startup
